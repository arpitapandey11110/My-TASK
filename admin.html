<form id="eventForm">

    <input
        type="text"
        id="eventName"
        placeholder="Event Name"
        required
    >

    <input
        type="date"
        id="eventDate"
        required
    >

    <input
        type="text"
        id="eventLocation"
        placeholder="Location"
        required
    >

    <textarea
        id="eventDetails"
        placeholder="Event Details"
    ></textarea>

    <button type="submit">Create Event</button>

    <button type="button"
            onclick="window.location.href='admin-events.html'">
        Manage Events
    </button>

</form>

<script src="admin.js"></script>
