<form id="registerForm">

    <input 
        type="text" 
        id="username" 
        placeholder="Username" 
        required
    >

    <input 
        type="email"
        id="email" 
        placeholder="Email" 
        required
    >

    <input 
        type="password" 
        id="password" 
        placeholder="Password" 
        required
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm Password"
        required
    >

    <button type="submit">Sign Up</button>

</form>

<p id="message"></p>

<script src="register.js"></script>
